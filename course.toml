[course]
slug = "docker-from-zero"
number = 1
title = "Docker from Zero"
tagline = "Images, layers and containers at the terminal, tested to 100%."
description = "Tested Rust code for the first course of the Docker specialization: imgscope reads a docker save tarball, recomputes layer digests and diffs images, each run for real in the terminal."
prerequisites = ["Docker 25 or newer", "Rust 1.80 or newer", "A Linux or macOS terminal"]

[[examples]]
dir = "examples/imgscope"
