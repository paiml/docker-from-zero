name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gate:
    name: gate
    runs-on: [self-hosted, clean-room, X64, intel]
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: scripts/coverage.sh
      - run: scripts/falsify.sh
      - run: pv lint contracts
      - run: cargo deny check
      - run: rmedia readme check .
      - run: scripts/leak-check.sh
